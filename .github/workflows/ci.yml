name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync web assets to Android
        run: |
          cp index.html android_app/app/src/main/assets/
          cp style.css android_app/app/src/main/assets/
          cp script.js android_app/app/src/main/assets/
          cp manifest.json android_app/app/src/main/assets/
          cp logo.png android_app/app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build Android debug APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
